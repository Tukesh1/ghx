name: Feature request
description: Suggest something ghx should show or do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or question this would help with. "I keep switching to the browser to…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like ghx to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
