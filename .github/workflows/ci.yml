name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race ./...
      - name: Build
        run: go build -o ghx${{ matrix.os == 'windows-latest' && '.exe' || '' }} .
      - name: Render check (every tab, every size)
        shell: bash
        run: ./ghx${{ matrix.os == 'windows-latest' && '.exe' || '' }} --demo --check

  minimum-go:
    name: Go version in go.mod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./... && go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  install-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint install.sh
        run: shellcheck install.sh
